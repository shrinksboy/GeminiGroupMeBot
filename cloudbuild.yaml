steps:
  # Build the Docker image.  Assumes a Dockerfile is in the root of your repository.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/stunning-symbol-450620-m7/geminigroupmebot/geminigroupmebot-develop:latest', '.']
    #  Replace 'us-central1', 'stunning-symbol-450620-m7', and 'geminigroupmebot'
    # with your Artifact Registry region, project ID, and repository name.
    # Also replace `geminigroupmebot` after the last slash to what you desire your service name to be.

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/stunning-symbol-450620-m7/geminigroupmebot/geminigroupmebot-develop:latest']
    #  Replace 'us-central1', 'stunning-symbol-450620-m7', and 'geminigroupmebot'
    # with your Artifact Registry region, project ID, and repository name

  #  Deploy to Cloud Run (Optional - Only include if deploying to Cloud Run)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'geminigroupmebot-develop'  # Replace with your Cloud Run service name
    - '--image'
    - 'us-central1-docker.pkg.dev/stunning-symbol-450620-m7/geminigroupmebot/geminigroupmebot-develop:latest'  # Full image path
    - '--platform'
    - 'managed'
    - '--region'
    - 'us-central1' # Replace with your desired region
    - '--allow-unauthenticated' # If you want to allow public access (remove this line if not)
  # You may have to explicitly assign the service account:
  #   - '--service-account'
  #   - 'YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com' # Replace

# Configure Cloud Build options
options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  # You'll likely need to specify a service account. The Compute Engine
  # default service account is often used.  Enable the Cloud Build API,
  # as mentioned in one of the previous errors.
  serviceAccount: 'YOUR_PROJECT_ID-compute@developer.gserviceaccount.com' #Replace the Project ID
#  logging: CLOUD_LOGGING_ONLY # Or NONE if you don't want logs stored in Cloud Storage

images:
  - 'us-central1-docker.pkg.dev/stunning-symbol-450620-m7/geminigroupmebot/geminigroupmebot-develop:latest' # Make sure this matches your image name